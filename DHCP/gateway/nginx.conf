events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost gateway-admin-vip;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        # Reverse proxy to the DHCP Cluster Dashboard
        location /cluster/ {
            proxy_pass http://192.168.10.200:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy API calls directly to the Load Balancer
        location /api/ {
            proxy_pass http://192.168.10.200:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
